<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI PDF Chatbot</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>

<body>

    <div class="container py-5">

        <!-- Header -->

        <div class="text-center mb-5">

            <h1 class="fw-bold">
                📄 AI PDF Chatbot
            </h1>

            <p class="text-muted">
                Upload a PDF and ask questions about it
            </p>

        </div>


        <!-- Upload Section -->

        <div class="card shadow-sm mb-4">

            <div class="card-body">

                <h4 class="mb-3">
                    Upload PDF
                </h4>

                <form id="uploadForm">

                    <div class="input-group">

                        <input
                            type="file"
                            id="pdfFile"
                            class="form-control"
                            accept=".pdf"
                            required
                        >

                        <button
                            type="submit"
                            class="btn btn-primary"
                        >
                            Upload PDF
                        </button>
                        <button
                                type="button"
                                id="clearButton"
                                class="btn btn-danger ms-2"
                            >
                                Clear PDF
                            </button> 



                    </div>

                </form>

                <div
                    id="uploadStatus"
                    class="mt-3"
                ></div>

            </div>

        </div>


        <!-- Question Section -->

        <div class="card shadow-sm">

            <div class="card-body">

                <h4 class="mb-3">
                    Ask a Question
                </h4>

                <div class="input-group">

                    <input
                        type="text"
                        id="questionInput"
                        class="form-control"
                        placeholder="Ask something about your PDF..."
                    >

                    <button
                        id="askButton"
                        class="btn btn-success"
                    >
                        Ask
                    </button>

                </div>


                <!-- Loading -->

                <div
                    id="loading"
                    class="mt-3 d-none"
                >
                    <div class="spinner-border spinner-border-sm"></div>

                    Thinking...
                </div>


                <!-- Answer -->

                <div
                    id="answerSection"
                    class="mt-4 d-none"
                >

                    <h5>
                        Answer
                    </h5>

                    <div
                        id="answer"
                        class="answer-box"
                    ></div>


                    <h6 class="mt-4">
                        Sources
                    </h6>

                    <div id="sources"></div>

                </div>

            </div>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script
        src="{{ url_for('static', filename='script.js') }}"
    ></script>

</body>

</html>
